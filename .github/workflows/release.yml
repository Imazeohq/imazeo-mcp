name: Create MCP release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: How should the current version increase?
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]
      confirm:
        description: Create the tag and publish to npm (leave unchecked for a preview)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mcp-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Imazeohq/imazeo-mcp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Calculate and check the next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "$GITHUB_SHA" ]]; then
            echo "::error::main changed after this run was requested. Start a new preview from main."
            exit 1
          fi
          args=("$BUMP")
          if [[ "$CONFIRM" == true ]]; then args+=(--apply); fi
          version="$(node scripts/release.mjs "${args[@]}")"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          printf 'Selected %s release → **v%s**\n' "$BUMP" "$version" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$CONFIRM" != true ]]; then
            echo 'Preview only. Run again with confirmation to release.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: inputs.confirm
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm test
          npm run check:package
          npm run check:registry
          git diff --binary > "$RUNNER_TEMP/mcp-release.patch"
      - if: inputs.confirm
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-release-patch
          path: ${{ runner.temp }}/mcp-release.patch
          if-no-files-found: error
          overwrite: true

  tag:
    if: inputs.confirm
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcp-release-patch
          path: ${{ runner.temp }}
      - name: Commit and push the release tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "$GITHUB_SHA" ]]; then
            echo "::error::main changed while preparing this release. Start a new release run."
            exit 1
          fi
          git apply --index "$RUNNER_TEMP/mcp-release.patch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Release @imazeo/mcp ${TAG#v}"
          git tag -a "$TAG" -m "@imazeo/mcp ${TAG#v}"
          git push --atomic --no-follow-tags origin HEAD:refs/heads/main "refs/tags/$TAG"

  dispatch:
    needs: [prepare, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # A push made with GITHUB_TOKEN does not trigger another push workflow.
      - name: Dispatch npm publication on the new tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f publish=true
          printf 'Dispatched [Release MCP package](%s/%s/actions/workflows/publish.yml) for **%s**.\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TAG" >> "$GITHUB_STEP_SUMMARY"
