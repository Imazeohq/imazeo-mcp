name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Confirm publication of the selected version tag to npm
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.publish && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release ref
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const { version } = JSON.parse(readFileSync("package.json", "utf8")); if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.GITHUB_REF_NAME !== "v" + version) process.exit(1);'
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:package
      - run: npm run check:registry
      - name: Publish the checked package with npm provenance
        run: |
          archive="$(npm pack --ignore-scripts --json | node -e 'const fs = require("node:fs"); const [pack] = JSON.parse(fs.readFileSync(0, "utf8")); process.stdout.write(pack.filename);')"
          npm publish "./$archive" --access public --provenance --ignore-scripts
