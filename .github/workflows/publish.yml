name: Release MCP package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm after preparing the release files
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Imazeohq/imazeo-mcp' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify release ref
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.match(version, /^\d+\.\d+\.\d+$/);
          assert.equal(process.env.GITHUB_REF_NAME, `v${version}`, 'Select the tag matching the package version.');
          NODE
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:registry
      - run: npm run check:package -- --pack
      - name: Upload the checked tarball and registry manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imazeo-mcp-${{ github.ref_name }}
          path: |
            imazeo-mcp-*.tgz
            server.json
          if-no-files-found: error
          overwrite: true

  publish:
    # v1.0.0 bootstraps the npm package before a trusted publisher can be added.
    if: inputs.publish || (github.event_name == 'push' && github.ref_name != 'v1.0.0')
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: imazeo-mcp-${{ github.ref_name }}
          path: release
      - name: Publish the checked package with npm provenance
        run: npm publish "./release/imazeo-mcp-${GITHUB_REF_NAME#v}.tgz" --access public --provenance --ignore-scripts
