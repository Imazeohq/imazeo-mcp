name: Release MCP package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm after preparing the release files
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Imazeohq/imazeo-mcp' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify release ref
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.match(version, /^\d+\.\d+\.\d+$/);
          assert.equal(process.env.GITHUB_REF_NAME, `v${version}`, 'Select the tag matching the package version.');
          NODE
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:registry
      - run: npm run check:package -- --pack
      - name: Upload the checked tarball and registry manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imazeo-mcp-${{ github.ref_name }}
          path: |
            imazeo-mcp-*.tgz
            server.json
          if-no-files-found: error
          overwrite: true

  publish:
    # v1.0.0 bootstraps the npm package before a trusted publisher can be added.
    if: inputs.publish || (github.event_name == 'push' && github.ref_name != 'v1.0.0')
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: imazeo-mcp-${{ github.ref_name }}
          path: release
      - name: Check npm package and version
        id: registry
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync } from 'node:fs';
          const version = process.env.GITHUB_REF_NAME.slice(1);
          const response = await fetch('https://registry.npmjs.org/@imazeo%2fmcp', {
            headers: { Accept: 'application/vnd.npm.install-v1+json' },
            signal: AbortSignal.timeout(20_000),
          });
          assert.notEqual(response.status, 404, 'The npm package does not exist. Follow the first publication instructions before retrying Trusted Publishing.');
          assert.ok(response.ok, 'Could not read npm release history (HTTP ' + response.status + ').');
          const published = (await response.json()).versions[version];
          if (published) {
            const tarball = readFileSync('release/imazeo-mcp-' + version + '.tgz');
            const integrity = 'sha512-' + createHash('sha512').update(tarball).digest('base64');
            assert.equal(published.dist.integrity, integrity, 'This version already exists on npm with a different tarball.');
            process.stdout.write('The checked tarball is already published.\n');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, 'publish=' + !published + '\n');
          NODE
      - name: Publish the checked package with npm provenance
        if: steps.registry.outputs.publish == 'true'
        run: npm publish "./release/imazeo-mcp-${GITHUB_REF_NAME#v}.tgz" --access public --provenance --ignore-scripts

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: imazeo-mcp-${{ github.ref_name }}
          path: release
      - name: Publish the GitHub Release and registry manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          files=("release/imazeo-mcp-${tag#v}.tgz" release/server.json)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' > "$RUNNER_TEMP/release-assets"; then
            for file in "${files[@]}"; do
              if ! grep -Fxq "${file##*/}" "$RUNNER_TEMP/release-assets"; then
                gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --generate-notes --title "@imazeo/mcp ${tag#v}"
          fi
